
name: SLSA Level 3 Provenance Generator

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions: {}

jobs:
  # Job 1: Build application
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Application Artifact
        run: |
          tar -czvf release.tar.gz -C ./code main.py requirements.txt

      - name: Generate SHA256 Checksum for SLSA
        id: hash
        run: |
          echo "hashes=$(sha256sum release.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: release.tar.gz
          if-no-files-found: error

  # Job 2: Generate SLSA Provenance
  provenance:
    needs: [build]

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0

    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
